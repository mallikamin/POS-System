# Park City HTTP -> HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name parkcity.sitaratech.info;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Park City HTTPS -> shared Orbit app (DB-per-tenant resolved by Host header)
server {
    listen 443 ssl;
    http2 on;
    server_name parkcity.sitaratech.info;

    ssl_certificate /etc/letsencrypt/live/parkcity.sitaratech.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkcity.sitaratech.info/privkey.pem;

    # Same per-request resolution as the POS blocks (OI-92 item 1). These two
    # were the last bare container names in the file, and they mattered more
    # than the POS ones: with a bare name, nginx REFUSES TO START if the name
    # cannot be resolved, so Orbit CRM's containers being down would stop the
    # SHARED nginx from starting and take pos-demo, eats and parkcity with it.
    # That is the 2026-03-26 incident class. Measured here: `nginx -t` on this
    # file failed outright with `host not found in upstream "orbit_api"`.
    #
    # ⚠️ NOTE THE MISSING TRAILING SLASH ON $orbit_web. It was
    # `proxy_pass http://orbit_web:80/;` before. A trailing slash means "replace
    # the matched location prefix", and under a VARIABLE that is applied
    # literally: keeping the slash sends every request to "/" and serves the
    # Orbit homepage for every URL. Verified in an isolated container:
    # with the slash, /customers/123/edit?tab=notes arrives as "/"; without it,
    # it arrives byte-identical to the current behaviour. Do not add it back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $orbit_api http://orbit_api:8000;
    set $orbit_web http://orbit_web:80;

    location /api/ {
        proxy_pass $orbit_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $orbit_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

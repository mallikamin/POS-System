name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

env:
  SERVER_HOST: 159.65.158.26
  SERVER_USER: root
  DEPLOY_PATH: /root/pos-system

# One deploy on the box at a time. Two pushes in quick succession used to race
# each other through deploy-remote.sh; now the second waits for the first.
# Never cancel an in-progress deploy: it may be mid-migration.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to DigitalOcean
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --force --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_WS_URL: /ws
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload built frontend to server
        run: |
          # Each build lands in its OWN directory, named by the commit it was
          # built from (OI-92 item 2). Nothing serves it yet: deploy-remote.sh
          # repoints www/current at it atomically once the backend for the
          # same commit is up. Never `--delete`: it wiped the server once.
          ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} \
            'mkdir -p ${{ env.DEPLOY_PATH }}/www/releases'

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/www/releases/${{ github.sha }}/

      - name: Deploy on server
        run: |
          # The remote script is a FILE, executed by path. It must never be fed
          # to ssh on stdin: `docker compose exec` reads stdin too, and would
          # swallow the rest of the script -- which is exactly how the migration
          # and nginx steps silently stopped running. `ssh -n` keeps stdin shut.
          #
          # The commit sha is passed explicitly so the script serves the build
          # THIS run uploaded, and refuses if `git pull` landed on a different
          # commit (a later push). The later push's own run will deploy itself.
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no             scripts/deploy-remote.sh             ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/deploy-remote.sh

          ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no             ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}             'bash /tmp/deploy-remote.sh ${{ github.sha }}'

      - name: Verify deployment
        run: |
          sleep 10

          # ⚠️ The User-Agent is NOT optional. nginx.demo.conf blocks bad bots
          # at SERVER level -- above every location, including /api/ -- and its
          # pattern matches `curl/`. A bare `curl` gets 444 (connection dropped,
          # no response), so this step failed on EVERY deploy regardless of
          # whether the deploy was actually fine. A red tick nobody believes is
          # worse than no tick at all.
          UA="Mozilla/5.0 (compatible; deploy-verify)"

          # Every hostname this box serves, not just the POS demo. The client's
          # tablet uses eats.sitaratech.info, and Orbit is a different project
          # sharing this nginx -- a deploy that quietly breaks either is a
          # failed deploy.
          for host in \
            pos-demo.duckdns.org \
            eats.sitaratech.info \
            orbit-voice.duckdns.org
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" \
              --max-time 20 "https://$host/" || echo 000)
            echo "$host -> $code"
            case "$code" in
              200|301|302|401|403) ;;
              *) echo "FAILED: $host returned $code"; exit 1 ;;
            esac

            # A hostname must present its OWN certificate. eats.sitaratech.info
            # silently served the pos-demo cert for two weeks because nothing
            # ever checked this.
            subject=$(echo | openssl s_client -connect "$host:443" \
              -servername "$host" 2>/dev/null \
              | openssl x509 -noout -subject 2>/dev/null || echo "none")
            echo "   cert: $subject"
            case "$subject" in
              *"$host"*) ;;
              *) echo "FAILED: $host is not serving its own certificate"; exit 1 ;;
            esac
          done

          curl -fsS -A "$UA" --max-time 20 \
            https://eats.sitaratech.info/api/v1/health > /dev/null || exit 1

          # Did the frontend THIS run built actually ship? Read the live
          # index.html, find the entry chunk it references, and check that
          # exact file exists in the dist/ this runner just built. A green
          # rsync proves nothing on its own: for months the wrong file was
          # edited and nothing noticed (ERROR_LOG, 2026-08-27 night).
          live_entry=$(curl -fsS -A "$UA" --max-time 20 https://eats.sitaratech.info/ \
            | grep -o 'src="/assets/index-[^"]*\.js"' | head -1 | sed 's/src="\/\(.*\)"/\1/')
          echo "live entry chunk: ${live_entry:-NONE}"
          if [ -z "$live_entry" ] || [ ! -f "frontend/dist/$live_entry" ]; then
            echo "FAILED: the live site is not serving the build from this commit."
            exit 1
          fi

          # Compression (OI-94). The bundle is served by THIS nginx now, so if
          # this header is missing the fix has silently stopped working.
          enc=$(curl -sSI -A "$UA" -H 'Accept-Encoding: gzip' --max-time 20 \
            "https://eats.sitaratech.info/$live_entry" | tr -d '\r' \
            | awk 'tolower($1)=="content-encoding:"{print $2}')
          echo "content-encoding on the entry chunk: ${enc:-NONE}"
          [ "$enc" = "gzip" ] || { echo "FAILED: entry chunk is not gzipped."; exit 1; }

          echo "All hosts healthy, all certificates correct, this build is live and compressed."

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

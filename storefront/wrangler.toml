name = "chick-shack-storefront"
compatibility_date = "2025-01-01"

# Serve the client's real domain. Cloudflare manages the DNS record and the
# SSL certificate for custom domains automatically — but any pre-existing A /
# CNAME on the same hostname must be deleted first or this errors.
[[routes]]
pattern = "chickshackg84.com"
custom_domain = true

[[routes]]
pattern = "www.chickshackg84.com"
custom_domain = true

# Static SPA. No worker script — Cloudflare serves ./dist directly and falls
# back to index.html so client-side view state survives a deep link / refresh.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

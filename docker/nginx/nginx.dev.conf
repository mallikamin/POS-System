# No upstream blocks. See docker/nginx/nginx.demo.conf for the full note (OI-92
# item 1). An upstream block caches the container IP at config load, so every
# `docker compose up -d backend` left this nginx proxying to a dead or, worse, a
# REASSIGNED address until it was recreated too. A variable in proxy_pass forces
# per-request re-resolution through Docker's embedded DNS instead.
server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $pos_backend  http://backend:8000;
    set $pos_frontend http://frontend:5173;

    client_max_body_size 10M;

    # -------------------------------------------------------
    # API requests -> FastAPI backend
    # -------------------------------------------------------
    location /api/ {
        proxy_pass $pos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------
    # WebSocket endpoint -> FastAPI backend
    # -------------------------------------------------------
    location /ws {
        proxy_pass $pos_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket alive for development
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------------------------------------------
    # Vite HMR WebSocket (dev only)
    # -------------------------------------------------------
    location /@vite/ {
        proxy_pass $pos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /__vite_ping {
        proxy_pass $pos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------
    # Everything else -> Vite dev server (frontend)
    # -------------------------------------------------------
    location / {
        proxy_pass $pos_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

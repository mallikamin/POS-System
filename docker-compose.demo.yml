name: pos-system

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
      - /root/orbit-crm/voice.conf:/etc/nginx/conf.d/voice.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      # The frontend (OI-92 item 2). CI drops each build in
      # www/releases/<git sha>/ and deploy-remote.sh points www/current at it
      # with an atomic symlink swap. nginx.demo.conf serves
      # /var/www/pos/current directly. There is no frontend container any more.
      #
      # ⚠️ This is the FIFTH mount nginx must never be recreated without. The
      # other four are listed above; losing any of them has taken a site down
      # before (voice.conf, 2026-03-26). deploy-remote.sh checks for this one
      # and recreates nginx exactly once, on the deploy that introduces it.
      - /root/pos-system/www:/var/www/pos:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"
        reservations:
          memory: 32M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32M
      - /var/run:size=1M
      - /tmp:size=8M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # No `frontend` service. It was a second nginx wrapping the Vite build, and
  # replacing it on every deploy was one of the two stop-the-world steps a
  # deploy had (OI-92). The build is now static files on the host, served by
  # the nginx above; see its volumes.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ENVIRONMENT=staging
      - DEBUG=false
      - LOG_LEVEL=info
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pos_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pos_system}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS}
      - QB_CLIENT_ID=${QB_CLIENT_ID}
      - QB_CLIENT_SECRET=${QB_CLIENT_SECRET}
      - QB_REDIRECT_URI=${QB_REDIRECT_URI}
      - QB_ENVIRONMENT=${QB_ENVIRONMENT:-sandbox}
      # Transactional email. This service has no `env_file:`, so a key added to
      # the env file is invisible to the container until it is declared here --
      # `--env-file` only feeds ${...} interpolation. Defaults match config.py,
      # so an unset key leaves email disabled rather than half-configured.
      # BREVO_API_KEY selects the HTTPS transport -- the droplet cannot reach
      # any SMTP port (DigitalOcean egress block, measured 2026-07-29, OI-55),
      # so on this host the SMTP_* keys below exist only as a fallback for a
      # future box.
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}
      - ORDER_TRACKING_BASE_URL=${ORDER_TRACKING_BASE_URL:-}
      # Card payment. Same rule as the email block above -- a key in the env
      # file that is not named here never reaches the container, and the
      # symptom is silence: card simply is not offered and the deploy is green.
      # An unset key leaves the whole feature cleanly off, which is the shop's
      # current, working state (cash on handover).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-}
      - STRIPE_ACCOUNT_CURRENCY=${STRIPE_ACCOUNT_CURRENCY:-gbp}
      # AI: OCR goods receiving and the ordering advisor. Third time the same
      # rule bites in this one file, so it is worth stating once more: this
      # service has NO `env_file:`, and `--env-file` only feeds ${...}
      # interpolation. A key sitting in .env.demo that is not named HERE never
      # reaches the container. The symptom is not an error -- it is the feature
      # politely reporting "AI is not configured on this server" while the
      # deploy runs green and the key looks fine on disk.
      #
      # Unset leaves both features cleanly OFF, which is the correct default:
      # receiving and ordering are the product, the model is an assist. Nothing
      # else in the system changes.
      #
      # 🔴 The caps are the answer to "how do I not get a $1000 invoice", and
      # AI_DAILY_COST_CAP_USD_PER_TENANT is the one that binds. Defaults here
      # match config.py deliberately: if this file and config.py ever disagree,
      # the looser of the two wins in production, which is the wrong direction
      # for a spending limit.
      #
      # 🔴 AI_ENABLED_TENANT_SLUGS is the blast-radius control and it is NOT
      # optional on this box. The key is server-wide; four tenants share this
      # server. Without a slug list, setting a key enables the feature for ALL
      # of them and the ceiling becomes the per-tenant cap x 4. Empty = nobody,
      # which fails loudly and free rather than silently and billed.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ENABLED_TENANT_SLUGS=${AI_ENABLED_TENANT_SLUGS:-}
      - AI_MODEL=${AI_MODEL:-claude-opus-5}
      - AI_DAILY_CALL_CAP_PER_TENANT=${AI_DAILY_CALL_CAP_PER_TENANT:-200}
      - AI_DAILY_TOKEN_CAP_PER_TENANT=${AI_DAILY_TOKEN_CAP_PER_TENANT:-2000000}
      - AI_DAILY_COST_CAP_USD_PER_TENANT=${AI_DAILY_COST_CAP_USD_PER_TENANT:-5.00}
    # Bind-mounted so logs survive container recreation (every deploy) and are
    # readable straight off the host -- `read_only: true` below still applies
    # to everything else. Host dir owned by uid 1000, matching Dockerfile's
    # pinned posapp uid; created/chowned idempotently in deploy-remote.sh.
    volumes:
      - /root/pos-system/logs/backend:/app/logs
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 384M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pos_system}
      - POSTGRES_USER=${POSTGRES_USER:-pos_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_admin} -d ${POSTGRES_DB:-pos_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # PostgreSQL tuning for 2GB shared server (POS + Orbit)
    command: >
      postgres
        -c shared_buffers=96MB
        -c effective_cache_size=256MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c wal_buffers=4MB
        -c max_connections=50
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=1000
        -c log_connections=on
        -c log_disconnections=on
        -c log_lock_waits=on

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
        reservations:
          memory: 16M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=8M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  certbot_webroot:
  certbot_certs:

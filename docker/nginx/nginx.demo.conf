# =============================================================================
# Demo/Staging nginx config — HARDENED
# SSL certs from Let's Encrypt via certbot
# Last updated: 2026-02-15
# =============================================================================

# --- Rate limiting zones ---
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/s;

# --- Connection limiting zone ---
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# --- Bot blocking by User-Agent ---
# Returns 1 for bad bots, 0 for everyone else
map $http_user_agent $is_bad_bot {
    default 0;
    ~*(?i)(scrapy|nikto|sqlmap|nmap|masscan|dirbuster|gobuster|wfuzz)     1;
    ~*(?i)(zgrab|censys|shodan|crawler|spider|bot)                        1;
    ~*(?i)(python-requests|python-urllib|java\/|curl\/|wget\/)            1;
    ~*(?i)(nessus|openvas|qualys|burpsuite|hydra|medusa)                  1;
    ""                                                                     1;
}

# --- Machine callers that must never be judged by user agent ---
#
# The bot filter above runs at SERVER level, above every location, and returns
# 444 -- a silent drop. A location block cannot undo it, because a server-level
# `if` is evaluated in the rewrite phase before a location is even chosen. So
# the only way to exempt a path is here, in the map.
#
# Stripe delivers webhooks as `Stripe/1.0 (+https://stripe.com/docs/webhooks)`.
# That string does not match any pattern above today -- checked character by
# character, `webhooks` contains no `bot`. But the second pattern blocks the
# bare substring `bot`, so ONE word added to Stripe's user agent would silently
# drop every webhook while Stripe retried for days and we saw nothing. That is
# too thin a thread to hang money on.
#
# Matched on $uri, which nginx has already normalised, NOT $request_uri -- the
# raw form would let `/api/v1/public/stripe/webhook/../../anything` slip past
# the bot filter for a completely different path.
#
# This exempts the path from the USER-AGENT filter only. It is still rate
# limited by the api_limit zone via `location /api/`, and the endpoint itself
# refuses anything without a valid Stripe signature -- and refuses everything
# when no signing secret is configured. The bot filter was never what protected
# it.
map $uri $is_machine_callback {
    default 0;
    /api/v1/public/stripe/webhook 1;
}

map "$is_bad_bot$is_machine_callback" $block_bad_bot {
    default 0;
    "10"    1;   # a bad user agent, on a path that is not a machine callback
}

# =============================================================================
# NO upstream BLOCKS FOR backend / frontend. This is deliberate (OI-92 item 1).
#
# An `upstream` block resolves its server name ONCE, at config load, and caches
# the container IP for the life of the process. Three measured consequences,
# all of which this file used to have:
#
#   1. Recreating backend or frontend gave them a NEW IP, and nginx kept using
#      the old one. That is the only reason a code deploy was forced to recreate
#      the SHARED nginx, and therefore the only reason a POS deploy could reach
#      Chick Shack's tablet and Orbit CRM at all.
#   2. A stale IP is not merely dead. Docker reassigns it, so nginx will proxy
#      to whatever container inherited it and return a plausible wrong answer
#      instead of an obvious 502.
#   3. If backend or frontend was not running when nginx started, nginx refused
#      to start AT ALL ("host not found in upstream"), taking every hostname on
#      the box down with it. That is the 2026-03-26 orbit-voice incident class.
#
# Instead, each POS server block sets a variable and uses it in proxy_pass.
# A variable in proxy_pass forces per-request re-resolution through Docker's
# embedded DNS at 127.0.0.11, so a recreated container is picked up within the
# resolver TTL and nginx never needs recreating on a code deploy again.
#
# Verified in an isolated Docker network before this change was written:
# URI passthrough is byte-identical to the old form (path, query string and the
# nested static-asset location); an IP change is picked up with nginx untouched;
# and a missing upstream now yields a 502 on that one route rather than a dead
# nginx.
# =============================================================================

# =============================================================================
# HTTP -> HTTPS redirect + ACME challenge
# =============================================================================
server {
    listen 80;
    server_name pos-demo.duckdns.org eats.sitaratech.info;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# Catch-all: reject requests for wrong Host header or direct IP access
# Prevents scanners hitting by IP from reaching the app
# =============================================================================
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/pos-demo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos-demo.duckdns.org/privkey.pem;

    # 444 = nginx drops connection silently, no response
    return 444;
}

# =============================================================================
# HTTPS server — main application
# =============================================================================
server {
    listen 443 ssl;
    server_name pos-demo.duckdns.org;

    # ----- SSL -----
    ssl_certificate /etc/letsencrypt/live/pos-demo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos-demo.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (faster TLS handshake for clients)
    ssl_stapling on;
    ssl_stapling_verify on;
    # Docker's embedded DNS. It serves BOTH jobs in this block: it resolves the
    # container names in the proxy_pass variables below, and it forwards
    # external names upstream for OCSP stapling (verified: a public name still
    # resolves through 127.0.0.11).
    #
    # It must be 127.0.0.11 ALONE. nginx round-robins a resolver list, so
    # leaving 1.1.1.1 in it would send half the queries for "backend" to a
    # public resolver and get NXDOMAIN.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Per-request upstream resolution. See the note where the upstream blocks
    # used to be. Do not turn this back into a bare name or an upstream block.
    # (There is no $pos_frontend any more: the frontend is static files served
    # by this nginx directly, see `location /` below.)
    set $pos_backend  http://backend:8000;

    # ----- Security Headers -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; connect-src 'self' wss://pos-demo.duckdns.org wss://eats.sitaratech.info; frame-ancestors 'self';" always;

    # ----- General settings -----
    server_tokens off;
    client_max_body_size 5M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # ----- Compression (OI-94) -----
    # Measured 2026-08-27: the main bundle left this server as 232,412 bytes with
    # no Content-Encoding. gzip had been "on" in two places, neither of which
    # this nginx ever loaded. THIS file is the one production reads, so this is
    # where it has to live. Only engages when the client sends Accept-Encoding,
    # so a caller that does not ask (Stripe's webhook delivery, for one) gets
    # exactly the bytes it got before. Already-compressed types (images, fonts)
    # are deliberately not listed. text/html is always included by nginx.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Global connection limit per IP
    limit_conn conn_per_ip 20;
    limit_conn_status 429;

    # Global rate limit (catch-all, generous)
    limit_req zone=global_limit burst=200 nodelay;
    limit_req_status 429;

    # ----- Block bad bots (Stripe's webhook path is exempt -- see the map) -----
    if ($block_bad_bot) {
        return 444;
    }

    # ----- Block common scanner paths (silent drop) -----
    location ~* ^.*(\.php|\.asp|\.aspx|\.jsp|\.cgi|\.env|\.git|wp-login|wp-admin|xmlrpc|phpmyadmin|/shell|/cmd|/eval|/setup|/install|/config\.).*$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    # ----- API -> FastAPI backend -----
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 10;

        proxy_pass $pos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Prevent proxy from buffering large responses into temp files
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 8k;
    }

    # ----- Login -> strict rate limit -----
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 3;

        proxy_pass $pos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ----- QuickBooks callback (needs longer timeout) -----
    location /api/v1/integrations/quickbooks/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass $pos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ----- WebSocket -----
    location /ws {
        # Limit WebSocket connections per IP
        limit_conn conn_per_ip 5;

        proxy_pass $pos_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ----- Frontend (React SPA): static files served by THIS nginx (OI-92 item 2) -----
    #
    # The frontend used to be a container that this block proxied to, so
    # shipping static files meant replacing a container, and every deploy had
    # a window in which `/` was a 502 for whoever was on the site. Now the
    # build lands on the host under /root/pos-system/www/releases/<git sha>/
    # and `current` is a symlink to one of them, swapped by deploy-remote.sh
    # with `mv -T` of a fresh symlink (never `ln -sfn`, which unlinks first).
    # This nginx serves `current` from a read-only bind mount. A frontend
    # deploy is a single rename(2): no container operation, no reload, and no
    # request ever sees a half-state.
    #
    # ⚠️ Caching below uses `expires`, NOT `add_header Cache-Control`, on
    # purpose. An `add_header` inside a location REPLACES every add_header
    # inherited from the server block, so a nested Cache-Control header here
    # would silently strip CSP, HSTS and the rest from index.html, the one
    # response where they matter most. `expires` has no such side effect, so
    # every security header above reaches every response.
    location / {
        root /var/www/pos/current;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Vite emits content-hashed files under /assets/. Cache for a year.
        # `^~` so the regex location below is not consulted for these.
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            access_log off;
        }

        # Un-hashed files at the root (favicon, images, fonts). A missing one
        # must be a 404, not index.html.
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 30d;
        }

        # index.html is the only entry point and must never be served stale,
        # or a tablet keeps asking for chunks from a release that is gone.
        # `expires -1` => Cache-Control: no-cache, i.e. revalidate every time
        # (a matching If-Modified-Since gets a 304, not the whole file).
        location = /index.html {
            expires -1;
        }
    }

    # ----- Block dotfiles -----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

